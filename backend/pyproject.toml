[project]
name = "hoarding-vision"
version = "0.1.0"
description = "Image analysis pipeline for step-by-step decluttering help"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pillow>=10.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "python-dotenv>=1.0",
    "google-genai>=2.25.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.4",
    "transformers>=4.45",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
